<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 뉴스 브리핑 | 2026.06.12</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0A0B14;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Sans KR', sans-serif;
  color: #EDEAE0;
}
.viewer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 20px;
}
.card-wrap {
  position: relative;
  width: 420px;
  height: 560px;
}
.card {
  position: absolute;
  inset: 0;
  width: 420px;
  height: 560px;
  background: radial-gradient(ellipse at 80% 0%, rgba(120,140,255,0.18) 0%, transparent 55%),
              radial-gradient(ellipse at 0% 100%, rgba(200,176,255,0.08) 0%, transparent 50%),
              #0A0B14;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
.card.active { opacity: 1; pointer-events: all; }
.nav {
  display: flex;
  align-items: center;
  gap: 16px;
}
.nav-btn {
  background: none;
  border: 1px solid rgba(155,181,255,0.3);
  color: #EDEAE0;
  width: 40px;
  height: 40px;
  cursor: pointer;
  font-size: 18px;
  font-family: 'JetBrains Mono', monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.2s;
}
.nav-btn:hover { border-color: rgba(155,181,255,0.7); }
.dots { display: flex; gap: 6px; align-items: center; }
.dot { height: 3px; border-radius: 2px; cursor: pointer; transition: all 0.3s; }
.dot.active { width: 24px; background: #9BB5FF; }
.dot.past { width: 12px; background: rgba(155,181,255,0.5); }
.dot.future { width: 8px; background: rgba(155,181,255,0.2); }
</style>
</head>
<body>
<div class="viewer">
  <div class="card-wrap">
    <div class="card active" id="c0"></div>
    <div class="card" id="c1"></div>
    <div class="card" id="c2"></div>
    <div class="card" id="c3"></div>
    <div class="card" id="c4"></div>
    <div class="card" id="c5"></div>
    <div class="card" id="c6"></div>
    <div class="card" id="c7"></div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn">←</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn">→</button>
  </div>
</div>

<script>

    source:'MIDJOURNEY', url:'updates.midjourney.com',

    source:'CREATEVISION', url:'createvision.ai/guides',

    source:'LOVART', url:'lovart.ai/blog',
    href:'https://www.lovart.ai/blog/video-generators-review',
    color:IMG, cat:'CAT.02', catLabel:'이미지/영상 AI'

function logoSVG(accent) {
  return `<svg width="20" height="20" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 2L26 14L14 26L2 14Z" stroke="${accent}" stroke-width="1.5"/><path d="M14 8L20 14L14 20L8 14Z" fill="${accent}"/><circle cx="14" cy="14" r="2" fill="#EDEAE0"/></svg>`;
}

function gridSVG(uid) {
  return `<svg style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0.06;pointer-events:none" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="g${uid}" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#EDEAE0" stroke-width="0.5"/></pattern></defs><rect width="100%" height="100%" fill="url(#g${uid})"/></svg>`;
}

function glowLine(accent) {
  return `<div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,${accent} 40%,${accent} 60%,transparent);opacity:0.7;"></div>`;
}

function corners(accent) {
  const s = `border-color:${accent};opacity:0.7;position:absolute;width:14px;height:14px;`;
  return `<div style="${s}top:18px;left:18px;border-top:1.5px solid;border-left:1.5px solid;"></div><div style="${s}top:18px;right:18px;border-top:1.5px solid;border-right:1.5px solid;"></div><div style="${s}bottom:18px;left:18px;border-bottom:1.5px solid;border-left:1.5px solid;"></div><div style="${s}bottom:18px;right:18px;border-bottom:1.5px solid;border-right:1.5px solid;"></div>`;
}

function wordmark(accent) {
  return `<div style="display:flex;align-items:center;gap:8px;">${logoSVG(accent)}<span style="font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:900;letter-spacing:0.22em;color:#EDEAE0;">VISUAL LAB</span></div>`;
}

      ${wordmark(a)}
      <div style="border:1px solid ${a};background:${BIG.soft};padding:5px 12px;display:flex;gap:8px;align-items:center;">
        <div style="width:6px;height:6px;border-radius:50%;background:${a};"></div>
        <span style="font-size:10px;letter-spacing:0.3em;font-family:'JetBrains Mono',monospace;color:${a};">DAILY</span>
      </div>
    </div>
    <div style="position:absolute;top:108px;left:32px;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.35em;color:${a};margin-bottom:10px;">TODAY'S</div>
      <div style="font-family:'Noto Serif KR',serif;font-size:60px;font-weight:900;color:#EDEAE0;line-height:0.95;letter-spacing:-0.02em;">AI</div>
      <div style="font-family:'Noto Serif KR',serif;font-size:34px;font-weight:400;color:#B8BACE;line-height:1.2;margin-top:6px;">briefing.</div>
      <div style="margin-top:18px;width:120px;height:1px;background:linear-gradient(to right,${a},transparent);opacity:0.8;"></div>
    </div>
    <div style="position:absolute;top:318px;left:32px;right:32px;height:1px;background:${BIG.line};"></div>
    <div style="position:absolute;top:334px;left:32px;right:32px;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.4em;color:#8A8DA8;margin-bottom:16px;">INDEX</div>
      <div style="display:flex;align-items:center;margin-bottom:12px;">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${a};letter-spacing:0.15em;min-width:56px;">CAT.01</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#8A8DA8;flex:1;padding-left:10px;">· AI 빅뉴스</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#B8BACE;">3건</span>
      </div>
      <div style="height:1px;background:rgba(155,181,255,0.1);margin-bottom:12px;"></div>
      <div style="display:flex;align-items:center;">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${IMG.accent};letter-spacing:0.15em;min-width:56px;">CAT.02</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#8A8DA8;flex:1;padding-left:10px;">· 이미지 / 영상 AI</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#B8BACE;">4건</span>

      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#B8BACE;letter-spacing:0.15em;">01 / 08</span>
    </div>
  `;

function buildNews(el, d, i) {
  const c = d.color;
  const num = String(i+2).padStart(2,'0');
  const titleLines = d.title.split('\n');
  el.innerHTML = `
    ${gridSVG('n'+i)}
    ${glowLine(c.accent)}
    ${corners(c.accent)}
    <div style="position:absolute;top:36px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;">
      ${wordmark(c.accent)}
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#8A8DA8;letter-spacing:0.15em;">${num} / 08</span>
    </div>
    <div style="position:absolute;top:84px;left:32px;display:inline-flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid ${c.accent};background:${c.soft};">
      <span style="font-size:10px;letter-spacing:0.35em;font-family:'JetBrains Mono',monospace;color:${c.accent};">${d.cat}</span>
      <span style="font-size:9px;color:${c.line};font-family:'JetBrains Mono',monospace;">·</span>
      <span style="font-size:11px;font-weight:500;letter-spacing:0.08em;font-family:'JetBrains Mono',monospace;color:#EDEAE0;">${d.catLabel}</span>
    </div>
    <div style="position:absolute;top:136px;left:32px;right:32px;">
      <div style="font-family:'Noto Serif KR',serif;font-size:29px;font-weight:700;color:#EDEAE0;line-height:1.38;word-break:keep-all;">${titleLines.join('<br>')}</div>
    </div>
    <div style="position:absolute;top:302px;left:32px;right:32px;display:flex;align-items:center;gap:12px;">
      <div style="flex:1;height:1px;background:${c.line};"></div>
      <div style="width:6px;height:6px;border:1px solid ${c.accent};transform:rotate(45deg);flex-shrink:0;"></div>
      <div style="flex:1;height:1px;background:${c.line};"></div>
    </div>
    <div style="position:absolute;top:318px;left:32px;right:32px;bottom:80px;overflow:hidden;">
      <div style="font-size:13.5px;line-height:1.65;color:#B8BACE;font-family:'Noto Sans KR',sans-serif;word-break:keep-all;">${d.brief}</div>
    </div>
    <div style="position:absolute;bottom:24px;left:32px;right:32px;padding-top:12px;border-top:1px solid ${c.line};display:flex;justify-content:space-between;align-items:flex-end;gap:12px;">
      <div style="overflow:hidden;">
        <div style="font-size:11px;font-weight:700;letter-spacing:0.3em;font-family:'JetBrains Mono',monospace;color:#EDEAE0;white-space:nowrap;">${d.source}</div>
        <div style="font-size:10px;font-family:'JetBrains Mono',monospace;color:#8A8DA8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.url}</div>
      </div>
      <a href="${d.href}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid ${c.accent};background:${c.soft};font-family:'JetBrains Mono',monospace;white-space:nowrap;text-decoration:none;flex-shrink:0;">
        <span style="font-size:12px;font-weight:500;color:#EDEAE0;">원문 보기</span>
        <span style="font-size:13px;color:${c.accent};">↗</span>
      </a>
    </div>
  `;
}

buildCover(document.getElementById('c0'));
news.forEach((n,i) => buildNews(document.getElementById('c'+(i+1)), n, i));

const total = 8;
let cur = 0;
const cards = document.querySelectorAll('.card');
const dotsEl = document.getElementById('dots');

for (let i=0; i<total; i++) {
  const d = document.createElement('div');
  d.className = 'dot '+(i===0?'active':'future');
  d.onclick = ()=>go(i);
  dotsEl.appendChild(d);
}

function go(n) {
  cards.forEach((c,i)=>c.classList.toggle('active',i===n));
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.className='dot '+(i<n?'past':i===n?'active':'future');
  });
  cur=n;
}

document.getElementById('prevBtn').onclick=()=>{if(cur>0)go(cur-1);};
document.getElementById('nextBtn').onclick=()=>{if(cur<total-1)go(cur+1);};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'&&cur>0)go(cur-1);
  if(e.key==='ArrowRight'&&cur<total-1)go(cur+1);
});
</script>
</body>
</html>
