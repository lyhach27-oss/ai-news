<!DOCTYPE html>

<title>VISUAL LAB AI 뉴스 브리핑 | 2026.06.09</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#07080f;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 20px;
}
#viewer{display:flex;flex-direction:column;align-items:center;gap:0;}
#card-wrap{position:relative;width:420px;height:560px;}
.card{
  position:absolute;top:0;left:0;width:420px;height:560px;
  overflow:hidden;display:none;
  background:
    radial-gradient(ellipse at 80% 0%,rgba(120,140,255,.18) 0%,transparent 55%),
    radial-gradient(ellipse at 0% 100%,rgba(200,176,255,.08) 0%,transparent 50%),
    #0A0B14;
}
.card.active{display:block;}
/* nav */
#nav{display:flex;align-items:center;gap:16px;margin-top:20px;}
.nbtn{
  background:none;border:1px solid rgba(155,181,255,.3);
  color:#9BB5FF;width:36px;height:36px;cursor:pointer;
  font-size:15px;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;transition:all .2s;
}
.nbtn:hover{background:rgba(155,181,255,.1);}
#dots{display:flex;gap:5px;align-items:center;}
.dot{
  height:3px;border-radius:2px;
  background:rgba(155,181,255,.2);
  transition:all .3s;width:8px;cursor:pointer;
}
.dot.active{width:20px;}
.dot.past{background:rgba(155,181,255,.45);}
</style>
</head>
<body>
<div id="viewer">
  <div id="card-wrap"></div>
  <nav id="nav">
    <button class="nbtn" id="prev">&#8592;</button>
    <div id="dots"></div>

  </nav>
</div>

// ── helpers ──────────────────────────────────────────────
function gridSVG(id){
  return `<svg style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:.06;pointer-events:none" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="${id}" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#EDEAE0" stroke-width=".5"/></pattern></defs><rect width="100%" height="100%" fill="url(#${id})"/></svg>`;
}

function glowLine(accent){
  return `<div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,${accent} 40%,${accent} 60%,transparent);opacity:.7;"></div>`;
}

function corners(accent){
  const s=`1.5px solid ${accent}`;
  return [
    `<div style="position:absolute;top:18px;left:18px;width:14px;height:14px;border-top:${s};border-left:${s};opacity:.7;"></div>`,
    `<div style="position:absolute;top:18px;right:18px;width:14px;height:14px;border-top:${s};border-right:${s};opacity:.7;"></div>`,
    `<div style="position:absolute;bottom:18px;left:18px;width:14px;height:14px;border-bottom:${s};border-left:${s};opacity:.7;"></div>`,
    `<div style="position:absolute;bottom:18px;right:18px;width:14px;height:14px;border-bottom:${s};border-right:${s};opacity:.7;"></div>`
  ].join('');
}

function logoMark(accent){
  return `<div style="display:flex;align-items:center;gap:8px;">
    <svg width="20" height="20" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 14 2 L 26 14 L 14 26 L 2 14 Z" stroke="${accent}" stroke-width="1.5"/>
      <path d="M 14 8 L 20 14 L 14 20 L 8 14 Z" fill="${accent}"/>
      <circle cx="14" cy="14" r="2" fill="#EDEAE0"/>
    </svg>
    <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:900;letter-spacing:.22em;color:#EDEAE0;">VISUAL LAB</span>
  </div>`;
}

// ── cover card ────────────────────────────────────────────

        <div style="width:6px;height:6px;border-radius:50%;background:${a};"></div>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3em;color:${a};">DAILY</span>
      </div>
    </div>
    <!-- main title -->

      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.45em;color:#8A8DA8;margin-bottom:6px;">TODAY'S</div>
      <div style="font-family:'Noto Serif KR',serif;font-size:82px;font-weight:900;color:#EDEAE0;line-height:1;">AI</div>
      <div style="font-family:'Noto Serif KR',serif;font-size:29px;font-weight:400;font-style:italic;color:#B8BACE;margin-bottom:22px;">briefing.</div>
      <div style="width:120px;height:1px;background:linear-gradient(to right,${a},transparent);opacity:.85;"></div>
    </div>

    <div style="position:absolute;top:338px;left:32px;right:32px;height:1px;background:${al};"></div>
    <!-- index -->

      <div style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.45em;color:#8A8DA8;margin-bottom:18px;">INDEX</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">

          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${al};">·</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;color:#B8BACE;">AI 빅뉴스</span>
        </div>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${a};">3건</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.25em;color:${IMG.accent};">CAT.02</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${IMG.accentLine};">·</span>

        </div>

      </div>
    </div>

    <div style="position:absolute;bottom:24px;left:32px;right:32px;padding-top:12px;border-top:1px solid ${al};display:flex;justify-content:space-between;align-items:center;">
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8DA8;letter-spacing:.12em;">2026.06.09 TUE</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${a};letter-spacing:.1em;">01 / 08</span>
    </div>
  </div>`;
}

// ── news card ─────────────────────────────────────────────
function buildNews(d,idx){
  const c=d.col, a=c.accent, al=c.accentLine, as_=c.accentSoft;
  return `<div class="card" id="card-${idx}">
    ${gridSVG('g'+idx)}
    ${glowLine(a)}
    ${corners(a)}
    <!-- header -->
    <div style="position:absolute;top:32px;left:32px;right:32px;display:flex;align-items:center;justify-content:space-between;">
      ${logoMark(a)}
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8DA8;letter-spacing:.1em;">${d.num} / 08</span>
    </div>
    <!-- CAT chip -->
    <div style="position:absolute;top:78px;left:32px;display:inline-flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid ${a};background:${as_};">
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.35em;color:${a};">CAT.${d.cat}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${al};">·</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.08em;color:#EDEAE0;">${d.catLabel}</span>
    </div>
    <!-- title -->
    <div style="position:absolute;top:136px;left:32px;right:32px;">
      <div style="font-family:'Noto Serif KR',serif;font-size:28px;font-weight:700;color:#EDEAE0;line-height:1.45;word-break:keep-all;">
        ${d.title}
      </div>
    </div>
    <!-- accent mark -->
    <div style="position:absolute;top:300px;left:32px;width:32px;height:2px;background:${al};border-radius:1px;"></div>
    <!-- brief -->
    <div style="position:absolute;top:316px;left:32px;right:32px;">
      <p style="font-family:'Noto Sans KR',sans-serif;font-size:13.5px;font-weight:400;color:#B8BACE;line-height:1.72;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;">
        ${d.brief}
      </p>
    </div>
    <!-- footer -->
    <div style="position:absolute;bottom:24px;left:32px;right:32px;padding-top:12px;border-top:1px solid ${al};display:flex;justify-content:space-between;align-items:flex-end;gap:12px;">
      <div style="min-width:0;flex:1;">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.28em;color:#EDEAE0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.sourceName}</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#8A8DA8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.sourceUrl}</div>
      </div>
      <a href="${d.link}" target="_blank" style="text-decoration:none;flex-shrink:0;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid ${a};background:${as_};white-space:nowrap;">
        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:#EDEAE0;">원문 보기</span>
        <span style="font-size:13px;color:${a};">↗</span>
      </a>
    </div>
  </div>`;
}

// ── build DOM ─────────────────────────────────────────────
const wrap=document.getElementById('card-wrap');
const dotsEl=document.getElementById('dots');
let html='';
CARDS.forEach((d,i)=>{
  html+=d.type==='cover'?buildCover():buildNews(d,i);
  const dot=document.createElement('div');
  dot.className='dot'+(i===0?' active':'');
  dot.dataset.i=i;
  dotsEl.appendChild(dot);
});
wrap.innerHTML=html;

// ── slider ────────────────────────────────────────────────
const cards=document.querySelectorAll('.card');
const dots=document.querySelectorAll('.dot');
const btns=document.querySelectorAll('.nbtn');
const N=cards.length;
let cur=0;

function accent(i){return i<4?BIG.accent:IMG.accent;}
function accentBorder(i){return i<4?'rgba(155,181,255,0.3)':'rgba(200,176,255,0.3)';}

function goTo(n){
  cards[cur].classList.remove('active');
  cur=(n+N)%N;
  cards[cur].classList.add('active');
  dots.forEach((d,i)=>{
    d.classList.remove('active','past');
    if(i===cur){d.classList.add('active');d.style.background=accent(i);}
    else if(i<cur){d.style.background=`rgba(${i<4?'155,181,255':'200,176,255'},0.45)`;d.classList.add('past');}
    else{d.style.background='rgba(155,181,255,0.2)';}
  });
  const ac=accent(cur);
  btns.forEach(b=>{b.style.color=ac;b.style.borderColor=accentBorder(cur);});
}

document.getElementById('prev').onclick=()=>goTo(cur-1);
document.getElementById('next').onclick=()=>goTo(cur+1);
dots.forEach(d=>d.onclick=()=>goTo(+d.dataset.i));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')goTo(cur-1);
  if(e.key==='ArrowRight')goTo(cur+1);
});

// init dot styles
dots.forEach((d,i)=>{
  if(i===0){d.style.background=accent(0);}
  else{d.style.background='rgba(155,181,255,0.2)';}
});
</script>
</body>
</html>
