<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VISUAL LAB AI 브리핑 | 2026.07.08</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #060710;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-wrapper {
      width: 420px;
      height: 560px;
      position: relative;
      overflow: hidden;
    }

    .card {
      position: absolute;
      top: 0; left: 0;
      width: 420px;
      height: 560px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      /* Grid background */
      background-image:
        linear-gradient(rgba(237,234,224,0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(237,234,224,0.055) 1px, transparent 1px),
        radial-gradient(ellipse at 80% 0%, rgba(120,140,255,0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 0% 100%, rgba(200,176,255,0.08) 0%, transparent 50%),
        linear-gradient(180deg, #0A0B14 0%, #0A0B14 100%);
      background-size: 32px 32px, 32px 32px, 100% 100%, 100% 100%, 100% 100%;
    }

    .card.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Glow line */
    .glow-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      opacity: 0.7;
    }

    /* Corner decorations */
    .corner {
      position: absolute;
      width: 14px; height: 14px;
      pointer-events: none;
      opacity: 0.7;
    }
    .corner-tl { top: 18px; left: 18px; border-top: 1.5px solid; border-left: 1.5px solid; }
    .corner-tr { top: 18px; right: 18px; border-top: 1.5px solid; border-right: 1.5px solid; }
    .corner-bl { bottom: 18px; left: 18px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
    .corner-br { bottom: 18px; right: 18px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

    /* Wordmark */
    .wordmark {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .wordmark-text {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.22em;
      font-family: 'JetBrains Mono', monospace;
      color: #EDEAE0;
    }

    /* Navigation */
    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
      width: 420px;
    }
    .nav-btn {
      background: none;
      border: 1px solid rgba(155,181,255,0.4);
      color: #9BB5FF;
      width: 36px; height: 36px;
      cursor: pointer;
      font-size: 16px;
      font-family: 'JetBrains Mono', monospace;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: rgba(155,181,255,0.1); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; background: none; }

    .dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .dot {
      height: 6px;
      border-radius: 3px;
      transition: all 0.3s;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="viewer">

    <div class="nav">
      <button class="nav-btn" id="prevBtn">←</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn" id="nextBtn">→</button>
    </div>
  </div>

        sourceName: 'ANDROIDHEADLINES',

        brief: 'Anthropic이 7월 8일부터 Claude 개인 사용자를 대상으로 신원 및 연령 인증을 단계적으로 확대한다. Persona 플랫폼을 통해 정부 발급 신분증 업로드와 안면 비교 인증이 요구된다. 보안 강화 및 수출 통제 컴플라이언스 준수 목적이다. Fable 5 크레딧 전환과 함께 플랫폼 관리 정책 강화의 일환이다. 초기엔 선택적 적용 후 점차 전 사용자로 확대될 예정이다.',
        sourceName: 'TECHTIMES',
        sourceUrl: 'techtimes.com/articles/319864/...',
        sourceFullUrl: 'https://www.techtimes.com/articles/319864/20260707/claude-fable-5-drops-subscriptions-tonight-enable-credits-lose-access.htm',

        brief: '중국 AI 기업 Zhipu(Z.ai)가 GLM-5.2 기반 무료 코딩 에이전트 ZCode를 공식 출시했다. Claude Code·GitHub Copilot·Cursor에 도전하며 터미널·브라우저·파일시스템 에이전트를 단일 환경에서 제공한다. API 요금은 입력 $1.40/백만으로 경쟁 대비 압도적으로 저렴하다. 미국 기업의 Anthropic·OpenAI 비용 급등에 따른 중국 AI 채택이 빠르게 늘고 있다.',

        title: ['Seedance 2.5', '네이티브 30초 4K 영상'],
        brief: 'ByteDance의 Seedance 2.5가 글로벌 엔터프라이즈 베타에 진입했다. 이전 2.0의 15초 한계를 넘어 스티칭 없이 네이티브 30초 4K 영상을 생성한다. 최대 50개 레퍼런스 에셋을 동시 지원해 스타일·모션·구도 일관성을 완벽히 유지한다. 프롬프트 이행도가 20% 향상됐고 7월 초 공개 예정이다. Kling·Runway Gen-4.5와 3파전 구도가 주목된다.',
        sourceName: 'TECHTIMES',

      {

        brief: 'ComfyUI v0.25.0 대규모 업데이트가 출시됐다. Runway Aleph2 영상 생성 노드가 공식 추가됐고 Kling V3-Turbo 모델과 오픈소스 Wan Bernini-R이 통합됐다. 10비트 비디오 입출력이 정식 지원돼 HDR 영상 워크플로우 구축이 가능해졌다. 이제 단일 ComfyUI 환경에서 Runway·Kling·Wan을 혼합 사용할 수 있어 오픈소스 영상 생성 워크플로우가 대폭 확장됐다.',
        sourceName: 'COMFY DOCS',
        sourceUrl: 'docs.comfy.org/changelog',

      {
        type: 'img',

        title: ['Ideogram v4', '타이포그래피 AI 최강'],
        brief: '6월 출시된 Ideogram v4가 텍스트 렌더링과 레이아웃 제어 분야 1위를 공고히 하고 있다. 광고·포스터·배너 등 타이포그래피 핵심 작업에서 Midjourney·Flux 2·GPT Image 2를 앞선다는 평가다. 이미지 생성 AI 시장은 GPT Image 2(멀티 편집)·Nano Banana 2(포토리얼 4K)·Flux 2(속도·볼륨)·Ideogram v4(타이포·레이아웃) 4강 구도로 재편 중이다.',
        sourceName: 'GRADUALLY.AI',
        sourceUrl: 'gradually.ai/en/ai-image-models/',
        sourceFullUrl: 'https://www.gradually.ai/en/ai-image-models/',
      },
      {
        type: 'img',
        num: '08 / 08',
        catNum: 'CAT.02',
        catLabel: '이미지/영상 AI',
        title: ['Fable 5 급등에', '중국 AI 영상 수요 급증'],
        brief: 'OpenAI·Anthropic 비용 급등으로 미국 기업의 중국 AI 모델 채택이 빠르게 늘고 있다고 CNBC가 보도했다. Wan 2.7 오픈소스·Kling·Seedance 등 중국산 영상·이미지 AI가 저렴한 대안으로 주목받고 있다. Fable 5 출력 $50/백만 vs. Z.ai $4.40/백만 격차가 채택 전환의 핵심 동인이다. GLM·Qwen·DeepSeek 수요가 폭증하며 글로벌 AI 비용 경쟁이 새 국면을 맞이했다.',
        sourceName: 'CNBC',
        sourceUrl: 'cnbc.com/2026/07/07/chinese-ai-...',
        sourceFullUrl: 'https://www.cnbc.com/2026/07/07/chinese-ai-models-costs-us-openai-anthropic.html',
      },

    function logoSVG(accent) {
      return `<svg width="20" height="20" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 14 2 L 26 14 L 14 26 L 2 14 Z" fill="none" stroke="${accent}" stroke-width="1.5"/>
        <path d="M 14 8 L 20 14 L 14 20 L 8 14 Z" fill="${accent}"/>
        <circle cx="14" cy="14" r="2" fill="#EDEAE0"/>
      </svg>`;
    }

    function wordmarkHTML(accent) {
      return `<div class="wordmark">${logoSVG(accent)}<span class="wordmark-text">VISUAL LAB</span></div>`;
    }

    function cornersHTML(accent) {
      return `
        <div class="corner corner-tl" style="border-color:${accent};"></div>
        <div class="corner corner-tr" style="border-color:${accent};"></div>
        <div class="corner corner-bl" style="border-color:${accent};"></div>
        <div class="corner corner-br" style="border-color:${accent};"></div>
      `;
    }

    function glowLineHTML(accent) {
      return `<div class="glow-line" style="background:linear-gradient(to right, transparent, ${accent} 40%, ${accent} 60%, transparent);"></div>`;
    }

    // Build cover card (card 0)
    function buildCover() {
      const C = BIG;
      return `
        <div class="card active" id="card-0">
          ${glowLineHTML(C.accent)}
          ${cornersHTML(C.accent)}

          <!-- Header -->
          <div style="position:absolute;top:36px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;">
            ${wordmarkHTML(C.accent)}
            <div style="border:1px solid ${C.accent};background:${C.accentSoft};display:flex;align-items:center;gap:8px;padding:5px 12px;">
              <div style="width:6px;height:6px;border-radius:50%;background:${C.accent};"></div>
              <span style="font-size:10px;letter-spacing:0.3em;font-family:'JetBrains Mono',monospace;color:${C.accent};">DAILY</span>
            </div>
          </div>

          <!-- Main Title -->
          <div style="position:absolute;top:140px;left:32px;right:32px;">
            <div style="font-family:'Noto Serif KR',serif;font-size:52px;font-weight:900;line-height:1.08;color:#EDEAE0;letter-spacing:-0.01em;">
              TODAY'S<br>AI<br><span style="font-style:italic;">briefing.</span>
            </div>
            <div style="margin-top:22px;width:120px;height:1px;background:linear-gradient(to right, ${C.accent}, transparent);opacity:0.9;"></div>
          </div>

          <!-- Divider -->
          <div style="position:absolute;top:342px;left:32px;right:32px;height:1px;background:${C.accentLine};"></div>

          <!-- Index -->
          <div style="position:absolute;top:358px;left:32px;right:32px;">
            <div style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.35em;color:#8A8DA8;margin-bottom:18px;">INDEX</div>

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${BIG.accent};letter-spacing:0.25em;">CAT.01</span>
                <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${BIG.accentLine};">·</span>
                <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#EDEAE0;letter-spacing:0.06em;">AI 빅뉴스</span>
              </div>
              <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#8A8DA8;">3건</span>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${IMG.accent};letter-spacing:0.25em;">CAT.02</span>
                <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${IMG.accentLine};">·</span>
                <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#EDEAE0;letter-spacing:0.06em;">이미지 / 영상 AI</span>
              </div>
              <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#8A8DA8;">4건</span>
            </div>
          </div>

          <!-- Footer -->
          <div style="position:absolute;bottom:24px;left:32px;right:32px;padding-top:12px;border-top:1px solid ${C.accentLine};display:flex;justify-content:space-between;align-items:center;">
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8DA8;">${DATE_STR} ${DOW_STR}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8DA8;">01 / 08</span>
          </div>
        </div>
      `;
    }

    // Build news card
    function buildNewsCard(item, cardIndex) {
      const C = item.type === 'big' ? BIG : IMG;
      const titleHTML = item.title.map(line =>
        `<div style="white-space:nowrap;">${line}</div>`
      ).join('');

      return `
        <div class="card" id="card-${cardIndex}">
          ${glowLineHTML(C.accent)}
          ${cornersHTML(C.accent)}

          <!-- Header -->
          <div style="position:absolute;top:36px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;">
            ${wordmarkHTML(C.accent)}
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8DA8;">${item.num}</span>
          </div>

          <!-- CAT chip -->
          <div style="position:absolute;top:84px;left:32px;">
            <div style="display:inline-flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid ${C.accent};background:${C.accentSoft};">
              <span style="font-size:10px;letter-spacing:0.35em;font-family:'JetBrains Mono',monospace;color:${C.accent};">${item.catNum}</span>
              <span style="font-size:9px;color:${C.accentLine};font-family:'JetBrains Mono',monospace;">·</span>
              <span style="font-size:11px;font-weight:500;letter-spacing:0.08em;font-family:'JetBrains Mono',monospace;color:#EDEAE0;">${item.catLabel}</span>
            </div>
          </div>

          <!-- Title -->
          <div style="position:absolute;top:136px;left:32px;right:32px;">
            <div style="font-family:'Noto Serif KR',serif;font-size:30px;font-weight:700;line-height:1.4;color:#EDEAE0;word-break:keep-all;">
              ${titleHTML}
            </div>
          </div>

          <!-- Accent mark -->
          <div style="position:absolute;top:300px;left:32px;display:flex;align-items:center;gap:8px;">
            <div style="width:32px;height:1.5px;background:${C.accentLine};"></div>
            <div style="width:6px;height:6px;border:1.5px solid ${C.accent};transform:rotate(45deg);"></div>
          </div>

          <!-- Brief -->
          <div style="position:absolute;top:318px;left:32px;right:32px;bottom:84px;overflow:hidden;">
            <p style="font-family:'Noto Sans KR',sans-serif;font-size:13.5px;line-height:1.78;color:#B8BACE;word-break:keep-all;">${item.brief}</p>
          </div>

          <!-- Footer -->
          <div style="position:absolute;bottom:24px;left:32px;right:32px;padding-top:12px;border-top:1px solid ${C.accentLine};display:flex;justify-content:space-between;align-items:flex-end;gap:12px;">
            <div style="flex:1;overflow:hidden;min-width:0;">
              <div style="font-size:11px;font-weight:700;letter-spacing:0.3em;font-family:'JetBrains Mono',monospace;color:#EDEAE0;">${item.sourceName}</div>
              <div style="font-size:10px;font-family:'JetBrains Mono',monospace;color:#8A8DA8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.sourceUrl}</div>
            </div>
            <a href="${item.sourceFullUrl}" target="_blank" rel="noopener" style="
              display:inline-flex;align-items:center;gap:8px;
              padding:8px 14px;flex-shrink:0;
              border:1px solid ${C.accent};background:${C.accentSoft};
              font-family:'JetBrains Mono',monospace;text-decoration:none;
            ">
              <span style="font-size:12px;font-weight:500;color:#EDEAE0;">원문 보기</span>
              <span style="font-size:13px;color:${C.accent};">↗</span>
            </a>
          </div>
        </div>
      `;
    }

    // Inject cards
    const wrapper = document.getElementById('cardWrapper');
    const html = [buildCover(), ...news.map((item, i) => buildNewsCard(item, i + 1))];
    wrapper.innerHTML = html.join('');

    // Slider logic
    const cardEls = wrapper.querySelectorAll('.card');
    const dotsEl = document.getElementById('dots');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    let current = 0;
    const total = cardEls.length; // 8

    // Build dots
    for (let i = 0; i < total; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(dot);
    }

    function updateUI() {
      const dotEls = dotsEl.querySelectorAll('.dot');
      dotEls.forEach((d, i) => {
        const C = i >= 4 ? IMG : BIG;
        if (i === current) {
          d.style.cssText = `width:20px;background:${C.accent};opacity:1;`;
        } else if (i < current) {
          d.style.cssText = `width:6px;background:${C.accent};opacity:0.5;`;
        } else {
          d.style.cssText = `width:6px;background:#8A8DA8;opacity:0.2;`;
        }
      });
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === total - 1;
    }

    function goTo(idx) {
      if (idx < 0 || idx >= total) return;
      cardEls[current].classList.remove('active');
      current = idx;
      cardEls[current].classList.add('active');
      updateUI();
    }

    prevBtn.addEventListener('click', () => goTo(current - 1));
    nextBtn.addEventListener('click', () => goTo(current + 1));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') goTo(current - 1);
      if (e.key === 'ArrowRight') goTo(current + 1);
    });

    updateUI();
  </script>
</body>
</html>
